name: Release

# Pushing a tag such as v1.0.0 publishes a GitHub release with that version's notes from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $version"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "hasr $GITHUB_REF_NAME" --notes-file notes.md
